# ┌──────────────────────────────────────────────┐
# │  Nebula — your settings                       │
# │  Almost everything here can be changed from   │
# │  the side panel (Super+A → Settings), and     │
# │  nothing needs a restart.                     │
# └──────────────────────────────────────────────┘

# Interface language: en | ru | auto (follow the system locale)
UI_LANG="auto"

# Wallpaper folder (subfolders are scanned too).
# To switch: Control Center → Wallpaper → paste a path into the search → Enter
WALL_DIR="$HOME/Pictures/Wallpapers"

# Default terminal
TERMINAL="kitty"

# Wallpaper transition (awww): grow | outer | wipe | wave | center | any | random
WALL_TRANSITION="grow"
WALL_TRANSITION_DURATION="1.2"
WALL_TRANSITION_FPS="60"

# A blurred copy of the wallpaper behind the overview (Super+O): 1 — yes, 0 — no
OVERVIEW_BLUR=1

# matugen scheme for the "From wallpaper" theme:
# scheme-tonal-spot | scheme-vibrant | scheme-expressive | scheme-fidelity | scheme-content | scheme-rainbow
MATUGEN_SCHEME="scheme-tonal-spot"

# Brightness and volume step, %; how many seconds a pill stays expanded
BRIGHTNESS_STEP=5
VOLUME_STEP=5
OSD_DURATION=1.6

# ── below is what the side panel writes (edit by hand if you like, then run: nb-settings apply) ──

# Menu bar: style frame (a frame around the screen) | floating | classic (full width, blurred) |
# islands (three islands) | pills | notch (the center hangs from the top) | minimal (no background) ·
# height · modules on the left / center / right (ids separated by spaces):
#   logo workspaces window media tray volume brightness language network bluetooth
#   battery cpu memory control clock power
# media in the center is the player (cover + title); it only shows up while music plays.
BAR_STYLE="frame"
BAR_HEIGHT=34
BAR_LEFT="logo workspaces window"
BAR_CENTER="media"
BAR_RIGHT="tray volume brightness language network battery control clock"
# Player: cover art in the menu bar · title length
BAR_MEDIA_COVER=1
BAR_MEDIA_LEN=40

# Desktop: frame thickness (for the frame style) · Dock: autohide | always | off ·
# apps pinned to the Dock — .desktop ids in order (auto — take the most launched ones on first run,
# none — nothing); easier to change in the Dock itself: right-click, drag around · desktop clock
FRAME_SIZE=8
DOCK="autohide"
DOCK_APPS="auto"
DESKTOP_CLOCK=1
# Desktop clock: position top-left | top | top-right | left | center | right | bottom-left | bottom |
# bottom-right · size in % · font (empty — Inter Display) · thin | light | regular | bold ·
# color light (white) | accent | theme · day of the week and date
DESK_CLOCK_POS="top"
DESK_CLOCK_SIZE=100
DESK_CLOCK_FONT=""
DESK_CLOCK_WEIGHT="light"
DESK_CLOCK_COLOR="light"
DESK_CLOCK_DATE=1
# Menu bar clock: 24-hour · seconds · day of the week and date
CLOCK_24H=1
CLOCK_SECONDS=0
CLOCK_DATE=1

# Windows: inactive opacity (0.5–1) · thin outline · corner radius · gaps ·
# new windows open at full width
WIN_OPACITY=0.9
WIN_BORDER=1
WIN_RADIUS=14
WIN_GAPS=10
WIN_MAXIMIZED=1

# Animations: 1/0 and speed (0.5 — half as fast, 2 — twice as fast)
ANIM_ENABLED=1
ANIM_SPEED=1.0
# Battery saver: no blur, inactive windows opaque (easier on the GPU)
ECO=0

# fastfetch: picture folder · fixed — the chosen one, random — a new one in every terminal ·
# picture height in lines
FETCH_DIR="$HOME/Pictures/Fastfetch"
FETCH_MODE="fixed"
FETCH_SIZE=16

# Web search from Search (the query goes on the end)
SEARCH_URL="https://www.google.com/search?q="

# Mouse and touchpad: tap to click · natural scrolling · pointer speed (-1…1) · scroll speed ·
# mouse speed (-1…1) · reverse wheel · focus follows mouse ·
# hot corner (window overview): off | top-left | top-right | bottom-left | bottom-right
TP_TAP=1
TP_NATURAL=1
TP_SPEED=0.15
TP_SCROLL=0.7
MOUSE_SPEED=0
MOUSE_NATURAL=0
FOCUS_FOLLOWS=1
HOT_CORNER="top-left"

# Keyboard: layouts, comma-separated (us,ru · us,ua · us,ru,ua …) ·
# layout switch: caps (Caps Lock; Shift+Caps is the real Caps) | alt_shift | ctrl_shift |
# ralt (right Alt) | none
KB_LAYOUTS="us,ru"
KB_SWITCH="caps"

# Notifications: nb-shell draws them (0 — leave them to mako or your own daemon) ·
# seconds on screen (0 — until you close them; hovering always pauses) · a soft sound for new ones ·
# top-right | top-left
NOTIFY=1
NOTIF_TIMEOUT=5
NOTIF_SOUND=0
NOTIF_POS="top-right"

# Fun stuff: easter eggs in Search (coin, dice, 8-ball, timer, "surprise me", Konami) ·
# a greeting at login · a new random wallpaper at every login
FUN=1
GREETING=1
WALL_ON_LOGIN=0

# The Claude add-on — off until you turn it on (in the installer or Control Center → Extras):
# 1 — Super+Shift+C, "?question" in Search, a Control Center page, a Dolphin menu ·
# Super+Shift+C opens terminal (Claude Code) | desktop (Claude Desktop) ·
# Claude Code permissions: default | plan | acceptEdits | auto · continue the last conversation in a folder ·
# the "Claude" menu in Dolphin
CLAUDE=0
CLAUDE_OPEN="terminal"
CLAUDE_MODE="default"
CLAUDE_CONTINUE=0
CLAUDE_DOLPHIN=1
