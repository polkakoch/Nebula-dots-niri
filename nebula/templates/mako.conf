# Nebula · {{name}} — generated by nb-theme, edits here get overwritten.
# mako is only the fallback: normally nb-shell draws notifications. Your own settings go in ~/.config/mako/user.conf

# frosted glass (the blur is a niri layer rule) and a thin outline
font=Inter 10.5
text-color={{fg}}
background-color={{bg}}d0
border-color={{fg}}1c
border-size=1
border-radius=16
progress-color=over {{accent}}44

width=360
height=160
# niri blurs mako's whole surface, so it must be exactly one card: no inner margin, one card at a time,
# and the spacing from the screen edge (and the frame) goes outside the surface instead
margin=0
padding=12,14
outer-margin=12,18,0,0

icons=1
max-icon-size=40
icon-border-radius=10
icon-location=left

markup=1
actions=1
format=<b>%s</b>\n<span alpha="85%%">%b</span>
text-alignment=left

anchor=top-right
layer=overlay
max-visible=1
sort=-time
history=1
max-history=50

# about 5 seconds for every notification (even if the app asks for longer)
default-timeout=5000
ignore-timeout=1

# click — dismiss, middle-click — open (default action), right-click — dismiss all
on-button-left=dismiss
on-button-middle=invoke-default-action
on-button-right=dismiss-all

# your own settings (global options and your own [sections])
include={{home}}/.config/mako/user.conf

[urgency=low]
border-color={{surface}}
text-color={{fg_dim}}

[urgency=critical]
border-color={{red}}
border-size=2
default-timeout=10000

[app-name=Nebula]
border-color={{accent}}55

# Do Not Disturb (makoctl mode -t dnd): only critical ones get through
[mode=dnd]
invisible=1

[mode=dnd urgency=critical]
invisible=0

