# ┌───────────────────────────────────────────────┐
# │  Nebula · lock screen (hyprlock)              │
# │  Colors and wallpaper: nebula-colors.conf     │
# └───────────────────────────────────────────────┘
source = ~/.config/hypr/nebula-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

animations {
    enabled = true
    bezier = ease, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 5, ease
    animation = fadeOut, 1, 5, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = $nb_wall
    color = $nb_bg
    blur_passes = 3
    blur_size = 8
    noise = 0.012
    brightness = 0.72
    vibrancy = 0.2
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = $nb_fg
    font_size = 112
    font_family = Inter Display SemiBold
    position = 0, 190
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
}

# Date
label {
    monitor =
    text = cmd[update:60000] LC_TIME=ru_RU.UTF-8 date +'%A, %-d %B' 2>/dev/null || date +'%A, %-d %B'
    color = $nb_dim
    font_size = 20
    font_family = Inter Medium
    position = 0, 90
    halign = center
    valign = center
}

# Avatar (if you have a ~/.face)
image {
    monitor =
    path = ~/.face
    size = 96
    rounding = -1
    border_size = 3
    border_color = $nb_accent
    position = 0, -20
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    rounding = -1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = $nb_accent $nb_accent2 45deg
    inner_color = $nb_surface
    font_color = $nb_fg
    check_color = $nb_accent2
    fail_color = $nb_red
    capslock_color = $nb_yellow
    fade_on_empty = false
    placeholder_text = <span alpha="60%">Пароль для $USER</span>
    fail_text = <b>Неверный пароль</b> · $ATTEMPTS
    font_family = Inter Medium
    position = 0, -130
    halign = center
    valign = center
}

# Keyboard layout (Caps Lock switches it)
label {
    monitor =
    text = 󰌌  $LAYOUT
    color = $nb_dim
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -195
    halign = center
    valign = center
}

# Battery and a hint at the bottom
label {
    monitor =
    text = cmd[update:30000] cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1 | sed 's/^/󰁹  /; s/$/%/'
    color = $nb_dim
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -30, 24
    halign = right
    valign = bottom
}
